name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:   # 👈 This enables manual run
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t s3-app .

      - name: Save Docker image
        run: docker save s3-app > s3-app.tar

      - name: Copy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "s3-app.tar"
          target: "~/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker load < s3-app.tar
            docker stop s3-app || true
            docker rm s3-app || true
            docker run -d -p 3000:3000 \
              --env-file .env \
              --name s3-app s3-app