name: Build and Push to ECR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # 👈 This enables manual run

permissions:
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  INSTANCE_ID: ${{ vars.INSTANCE_ID }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Configure AWS credentials
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/Github-oidc-role-ecr-ssm
        aws-region: ap-south-1

    - name: debug
      shell: bash
      run: |
        echo "AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID"
        echo "INSTANCE_ID: $INSTANCE_ID"

    # Login to ECR
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Setup Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build and Push
    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true   # 👈 IMPORTANT (changed from false)
        tags: ${{ steps.login-ecr.outputs.registry }}/test-s3:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run SSM Command and wait for result
      shell: bash
      run: |
        set -e

        INSTANCE_ID=$INSTANCE_ID
        #AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }}
        # Set this to your EC2 instance ID

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "set -e",
            "sudo systemctl start docker",
            "export AWS_REGION=${{ secrets.AWS_REGION }}",
            "export S3_BUCKET=${{ secrets.S3_BUCKET }}",

            "LOGIN_PASSWORD=$(aws ecr get-login-password --region ap-south-1)",
            "echo \"$LOGIN_PASSWORD\" | sudo docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com",

            "sudo docker pull $AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/test-s3:latest",

            "sudo docker stop app || true",
            "sudo docker rm app || true",

            "sudo docker run -d --name app -p 3000:3000 $AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/test-s3:latest"
          ]' \
          --query "Command.CommandId" \
          --output text)

        echo "Command ID: $COMMAND_ID"

        # Wait until command finishes
        STATUS="Pending"
        while [[ "$STATUS" == "Pending" || "$STATUS" == "InProgress" ]]; do
          sleep 3
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query "CommandInvocations[0].Status" \
            --output text)
          echo "Current status: $STATUS"
        done

        # Fetch output
        OUTPUT=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardOutputContent" \
          --output text)

        ERROR_OUTPUT=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "StandardErrorContent" \
          --output text)

        echo "===== STDOUT ====="
        echo "$OUTPUT"

        echo "===== STDERR ====="
        echo "$ERROR_OUTPUT"

        # Fail if not success
        if [[ "$STATUS" != "Success" ]]; then
          echo "SSM command failed with status: $STATUS"
          exit 1
        fi