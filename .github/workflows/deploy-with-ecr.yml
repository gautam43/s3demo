name: Build and Push to ECR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # 👈 This enables manual run

permissions:
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  INSTANCE_ID: ${{ vars.INSTANCE_ID }}


jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/Github-oidc-role-ecr-ssm
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        id: image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/test-s3:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/Github-oidc-role-ecr-ssm
          aws-region: ap-south-1

      - name: Deploy via SSM
        run: |
          COMMANDS=$(cat <<EOF
          [
            "set -e",
            "sudo systemctl start docker",
            "LOGIN_PASSWORD=\$(aws ecr get-login-password --region ap-south-1)",
            "echo \"\$LOGIN_PASSWORD\" | sudo docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com",
            "sudo docker pull ${{ needs.build.outputs.image }}",
            "sudo docker stop app || true",
            "sudo docker rm app || true",
            "sudo docker run -d --name app -p 3000:3000 ${{ needs.build.outputs.image }}"
          ]
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait until command finishes
          STATUS="Pending"
          while [[ "$STATUS" == "Pending" || "$STATUS" == "InProgress" ]]; do
            sleep 3
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current status: $STATUS"
          done

          # Fetch output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text)

          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text)

          echo "===== STDOUT ====="
          echo "$OUTPUT"

          echo "===== STDERR ====="
          echo "$ERROR_OUTPUT"

          # Fail if not success
          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi